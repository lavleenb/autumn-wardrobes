    <section class="game-box">
        <div class="doll-left">
            <div class="parent">
                <img id="base-layer" src="kirsten wardrobe/base-layer.png">
                <img class="clothing" id="tights" src="kirsten wardrobe/tights.png">
                <img class="clothing" id="dress" src="kirsten wardrobe/dress.png">
                <img class="clothing" id="glasses" src="kirsten wardrobe/glasses.png">
                <img class="clothing" id="heels" src="kirsten wardrobe/heels.png">
                <img class="clothing" id="skirt" src="kirsten wardrobe/skirt.png">

                <img class="clothing" id="bag" src="kirsten wardrobe/bag.png">
            </div>
        </div>
        <div class="wardrobe-right">
            <div class="row">
                <div class="container">
                    <button class="wardrobe-btn" clothing-item="bag"><img src="kirsten wardrobe/bag copy.png"></button>
                    <button class="wardrobe-btn" clothing-item="dress"><img src="kirsten wardrobe/dress copy.png"></button>
                    <button class="wardrobe-btn" clothing-item="glasses"><img src="kirsten wardrobe/glasses copy.png"></button>

                    <button id="tights-btn" clothing-item="tights"><img id="tights-btn" src="kirsten wardrobe/tights copy.png"></button>
                    <button class="wardrobe-btn" clothing-item="vest"><img src="kirsten wardrobe/vest copy.png"></button>
                </div>
            </div>

        </div>
